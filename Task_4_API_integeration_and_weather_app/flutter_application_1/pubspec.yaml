name: atmos_weather
description: >
  Atmos — a portfolio-quality Flutter weather app with a live, weather-reactive
  sky animation, hourly & 7-day forecasts, and graceful error handling.
  Powered by the free Open-Meteo API (no key required).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
